<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#d4d4d8"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="880" height="300" rx="14" fill="#f4f4f5"/>
  <rect width="880" height="300" rx="14" fill="url(#dots)"/>
  <text x="28" y="40" font-size="17" font-weight="700" fill="#18181b">Embed Documents</text>
  <text x="28" y="62" font-size="13" fill="#71717a">POST /webhook/embed-documents · async, one callback per chunk</text>

  <g stroke="#9ca3af" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M188 150 H262"/>
    <path d="M388 150 H462"/>
    <path d="M588 150 H662"/>
  </g>

  <g>
    <path d="M88 110 h56 a14 14 0 0 1 14 14 v52 a14 14 0 0 1 -14 14 h-56 a40 40 0 0 1 -40 -40 a40 40 0 0 1 40 -40 z" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
    <path d="M86 138 l14 24 l14 -24 M100 162 v-34" stroke="#ff6d5a" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="103" y="216" font-size="14" font-weight="600" fill="#18181b" text-anchor="middle">Webhook</text>
    <text x="103" y="234" font-size="12" fill="#71717a" text-anchor="middle">POST chunks</text>
  </g>

  <g>
    <rect x="272" y="110" width="110" height="80" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
    <g fill="#8b5cf6">
      <rect x="302" y="132" width="50" height="9" rx="3"/>
      <rect x="302" y="146" width="50" height="9" rx="3" opacity="0.75"/>
      <rect x="302" y="160" width="50" height="9" rx="3" opacity="0.5"/>
    </g>
    <text x="327" y="216" font-size="14" font-weight="600" fill="#18181b" text-anchor="middle">Split Out</text>
    <text x="327" y="234" font-size="12" fill="#71717a" text-anchor="middle">one item per chunk</text>
  </g>

  <g>
    <rect x="472" y="110" width="110" height="80" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
    <circle cx="527" cy="150" r="22" fill="none" stroke="#0ea5e9" stroke-width="3.5"/>
    <path d="M505 150 h44 M527 128 c-10 12 -10 32 0 44 c10 -12 10 -32 0 -44" stroke="#0ea5e9" stroke-width="2.5" fill="none"/>
    <text x="527" y="216" font-size="14" font-weight="600" fill="#18181b" text-anchor="middle">Embed</text>
    <text x="527" y="234" font-size="12" fill="#71717a" text-anchor="middle">POST /v1/embeddings</text>
    <text x="527" y="250" font-size="12" fill="#71717a" text-anchor="middle">chat template</text>
  </g>

  <g>
    <rect x="672" y="110" width="110" height="80" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
    <circle cx="727" cy="150" r="22" fill="none" stroke="#0ea5e9" stroke-width="3.5"/>
    <path d="M716 150 l8 8 l14 -16" stroke="#0ea5e9" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="727" y="216" font-size="14" font-weight="600" fill="#18181b" text-anchor="middle">Save Embedding</text>
    <text x="727" y="234" font-size="12" fill="#71717a" text-anchor="middle">POST callback</text>
    <text x="727" y="250" font-size="12" fill="#71717a" text-anchor="middle">dev or prod by env</text>
  </g>
</svg>
